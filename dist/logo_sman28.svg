<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c5ddc" />
      <stop offset="100%" stop-color="#0000fe" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#feb52b" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Ring -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="url(#gradPrimary)" stroke-width="6" />
  <circle cx="100" cy="100" r="82" fill="url(#gradPrimary)" />
  
  <!-- Laurel / Gold Laurel Leaf Border Accent -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#gradGold)" stroke-width="2.5" stroke-dasharray="6 3" />
  
  <!-- Inner Shield -->
  <path d="M100 38 L142 54 C142 98 124 134 100 152 C76 134 58 98 58 54 Z" fill="#ffffff" stroke="url(#gradGold)" stroke-width="3" />
  
  <!-- Number 28 -->
  <text x="100" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#1c5ddc" text-anchor="middle" letter-spacing="-1">28</text>
  
  <!-- Text Label -->
  <text x="100" y="118" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#f59e0b" text-anchor="middle" letter-spacing="1.5">SMAN 28</text>
  <text x="100" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#64748b" text-anchor="middle" letter-spacing="1">JAKARTA</text>
  
  <!-- Star on Top -->
  <polygon points="100,43 103,50 110,50 104,54 106,61 100,57 94,61 96,54 90,50 97,50" fill="url(#gradGold)" />
</svg>
